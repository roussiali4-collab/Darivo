privacy:["آخر تحديث: 15 نوفمبر 2026", "مرحباً بك في {name}، المنصة الإلكترونية المتخصصة في إعلانات العقارات والأراضي والخدمات في المملكة المغربية.", "نحن نحترم خصوصية مستخدمينا ونلتزم بحماية بياناتهم الشخصية، ونعمل على معالجتها وفقاً للقوانين المعمول بها في المملكة المغربية، وخاصة القانون رقم 09-08 المتعلق بحماية الأشخاص الذاتيين تجاه معالجة المعطيات ذات الطابع الشخصي.", "باستخدامك لمنصتنا أو إنشاء حساب فيها، فإنك توافق على أحكام سياسة الخصوصية هذه.", "§ 1. المعلومات التي نقوم بجمعها", "عند استخدام المنصة، قد نقوم بجمع المعلومات التالية:", "¶ أولاً: معلومات الحساب", "• الاسم (الذي يظهر على إعلاناتك).", "• عنوان البريد الإلكتروني (لا يظهر في الموقع للعموم).", "• المدينة ونوع الخدمة التي يختارها المعلن عند إنشاء الحساب.", "• كلمة المرور الخاصة بالحساب (تُحفظ بصيغة مشفّرة آمنة ولا تُعرض لأي مستخدم). ويُرسل رمز تأكيد إلى بريدك عند إنشاء الحساب أو عند استعادة كلمة المرور.", "¶ ثانياً: معلومات الإعلانات", "• نوع العقار أو الخدمة (شقة، منزل، فيلا، غرفة، أرض، خدمات وغيرها).", "• المدينة والمنطقة.", "• السعر المطلوب للبيع أو الكراء.", "• صور الإعلان.", "• وصف الإعلان ومساحته ومواصفاته.", "• رقم الهاتف / واتساب الذي يضعه المعلن في الإعلان، وبريد إلكتروني للتواصل اختياري (يظهر للزوار علناً إن أضافه).", "• الآراء والتعليقات التي يكتبها الزوار، مع الاسم الذي يدخلونه.", "¶ ثالثاً: المعلومات التقنية", "• عنوان IP عند الاقتضاء.", "• نوع الجهاز والمتصفح.", "• بيانات استخدام الموقع.", "• ملفات تعريف الارتباط (Cookies) وفق إعدادات المستخدم.", "§ 2. كيفية استخدام المعلومات", "نستخدم المعلومات التي نجمعها للأغراض التالية:", "• إنشاء حسابات المستخدمين وإدارتها.", "• السماح بنشر الإعلانات.", "• عرض العقارات والخدمات للزوار.", "• تمكين المهتمين من التواصل مع المعلنين.", "• التحقق من الحسابات والحد من الإعلانات الوهمية والاحتيالية.", "• تحسين خدمات المنصة وتجربة الاستخدام.", "• حماية الموقع من الأنشطة غير القانونية أو إساءة الاستخدام.", "• إرسال الإشعارات المتعلقة بالحساب والإعلانات عند الضرورة.", "§ 3. خصوصية أرقام الهواتف", "تتيح منصتنا للمعلنين إمكانية إضافة رقم هاتف للتواصل مع المهتمين بإعلاناتهم. نوضح ما يلي:", "• رقم الهاتف الذي يضعه المعلن في إعلانه يظهر للزوار علناً، ليتمكنوا من التواصل معه بالهاتف أو واتساب.", "• لا يظهر الرقم في أي مكان آخر من الموقع خارج الإعلان. وبريد حسابك لا يظهر للعموم، أما البريد الاختياري الذي تضيفه إلى إعلانك فيظهر لتمكين الزوار من مراسلتك.", "• يتحمل المعلن مسؤولية التأكد من صحة رقم الهاتف المنشور، وألا ينشر رقماً لا يملك الحق في استخدامه.", "• يمكن للمعلن تعديل الرقم أو حذف الإعلان في أي وقت من خلال حسابه.", "لا نقوم بنشر رقم هاتف أي مستخدم إلا ضمن إعلان أدخله بنفسه.", "§ 4. مشاركة المعلومات مع أطراف أخرى", "نحن لا نبيع البيانات الشخصية للمستخدمين ولا نتاجر بها.", "قد تتم مشاركة بعض المعلومات عند الضرورة مع:", "• مزودي خدمات الاستضافة وتشغيل الموقع.", "• مزودي خدمات قواعد البيانات وتخزين الملفات (مثل Supabase).", "• مزودي خدمات الحماية والتحليلات التقنية.", "• الجهات الحكومية والقضائية المختصة عندما يفرض القانون ذلك.", "نحرص على أن تتم معالجة البيانات وفق الضمانات القانونية والأمنية المناسبة.", "§ 5. تخزين البيانات وحمايتها", "نعتمد تدابير تقنية وتنظيمية مناسبة لحماية المعلومات الشخصية من الوصول غير المصرح به أو التعديل أو الفقدان أو الكشف غير المشروع.", "قد نستخدم خدمات استضافة وقواعد بيانات خارج المملكة المغربية لتشغيل المنصة. وفي هذه الحالة، تتم مراعاة المتطلبات القانونية المتعلقة بنقل المعطيات الشخصية إلى الخارج، وفقاً للقانون المغربي رقم 09-08.", "§ 6. ملفات تعريف الارتباط (Cookies)", "قد يستخدم الموقع ملفات تعريف الارتباط أو التخزين في المتصفح لتحسين تجربة المستخدم، ومنها:", "• حفظ تفضيلات المستخدم (مثل اللغة).", "• تسهيل تسجيل الدخول.", "• تحسين أداء الموقع.", "• تحليل الزيارات والاستخدام.", "• عرض الإعلانات عند تفعيل خدمات الإعلانات.", "يمكن للمستخدم التحكم في ملفات تعريف الارتباط من خلال إعدادات المتصفح أو لوحة تفضيلات ملفات الارتباط المتاحة بالموقع.", "§ 7. الإعلانات والخدمات الخارجية", "قد تستخدم المنصة مستقبلاً خدمات إعلانية مثل Google AdSense. يمكن لهذه الخدمات استخدام تقنيات ملفات تعريف الارتباط أو تقنيات مشابهة لتقديم الإعلانات وقياس أدائها وفق إعدادات الموافقة والمتطلبات القانونية المعمول بها.", "تخضع هذه الخدمات أيضاً لسياسات الخصوصية الخاصة بمزوديها.", "§ 8. حقوق المستخدم", "وفقاً للقانون المغربي رقم 09-08، يتمتع المستخدم بالحقوق القانونية المتعلقة بمعطياته الشخصية، بما في ذلك:", "• الحق في معرفة المعلومات التي تتم معالجتها.", "• الحق في الوصول إلى بياناته الشخصية.", "• الحق في طلب تصحيح المعلومات غير الدقيقة.", "• الحق في طلب حذف البيانات عندما تتوفر الشروط القانونية لذلك.", "• الحق في الاعتراض على معالجة بياناته في الحالات التي يسمح بها القانون.", "• الحق في سحب الموافقة عندما تكون المعالجة مبنية عليها، دون التأثير على قانونية المعالجة السابقة للسحب.", "يمكن ممارسة هذه الحقوق من خلال التواصل معنا عبر البريد الإلكتروني الموضح أدناه، مع مراعاة الشروط والاستثناءات القانونية.", "§ 9. حذف الحساب", "يمكن للمستخدم طلب حذف حسابه من المنصة. عند تقديم طلب الحذف، نقوم بمعالجة الطلب وفق الإجراءات المعتمدة، وقد يتم حذف أو إخفاء الإعلانات المرتبطة بالحساب.", "قد نحتفظ ببعض المعلومات عندما يكون ذلك ضرورياً للوفاء بالتزامات قانونية أو لحماية الحقوق والمصالح المشروعة للمنصة، وفقاً للقانون.", "§ 10. مسؤولية المستخدم", "يلتزم المستخدم بما يلي:", "• تقديم معلومات صحيحة عند التسجيل.", "• عدم نشر معلومات شخصية تخص أشخاصاً آخرين دون إذنهم.", "• عدم نشر أرقام هواتف أو صور أو بيانات لا يملك الحق في استخدامها.", "• المحافظة على سرية كلمة المرور ورموز التأكيد التي تصله.", "• عدم استخدام المنصة لأغراض احتيالية أو غير قانونية.", "§ 11. خصوصية الأطفال", "المنصة موجهة للأشخاص الذين يمكنهم قانونياً إنشاء حسابات واستخدام خدماتها. لا نستهدف جمع البيانات الشخصية للأطفال بشكل متعمد دون مراعاة الموافقات والمتطلبات القانونية المتعلقة بهم.", "§ 12. التعديلات على سياسة الخصوصية", "نحتفظ بحق تحديث سياسة الخصوصية عند الحاجة، سواء نتيجة تطوير خدمات المنصة أو التغييرات القانونية. سيتم نشر النسخة الجديدة على هذه الصفحة مع تحديث تاريخ آخر تعديل.", "ننصح المستخدمين بمراجعة هذه الصفحة بشكل دوري.", "§ 13. التواصل معنا", "إذا كانت لديك أسئلة أو طلبات تتعلق بخصوصية بياناتك الشخصية، يمكنك التواصل معنا عبر:", "• اسم المنصة: {name}", "• البريد الإلكتروني: {email}", "• الدولة: المملكة المغربية", "• الموقع الإلكتروني: {site}", "كما يمكن للمستخدم ممارسة حقوقه لدى اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي (CNDP)، وفقاً للإجراءات القانونية المعمول بها.", "¶ {name}", "نهدف إلى توفير بيئة رقمية موثوقة وآمنة لإعلانات العقارات والخدمات في المغرب."]}};

const ddSig=s=>s.value+"|"+[...s.options].map(o=>o.value+":"+o.text).join("|");
const ddSee=el=>{if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"})};
function ddFill(s){const d=s._dd;
d.u.innerHTML=[...s.options].map(o=>`<li role="option" data-o="${esc(o.value)}" aria-selected="${o.selected}">${esc(o.text)}</li>`).join("");
d.b.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].text:"";s._sig=ddSig(s)}
function ddClose(){document.querySelectorAll(".dd.open").forEach(w=>{w.classList.remove("open");w.querySelector(".dd-b").setAttribute("aria-expanded","false")})}
function ddOpen(s){ddClose();const d=s._dd;d.w.classList.add("open");d.b.setAttribute("aria-expanded","true");
[...d.u.children].forEach(x=>x.classList.toggle("hl",x.getAttribute("aria-selected")=="true"));
ddSee(d.u.querySelector(".hl"));if(d.w.closest("dialog"))ddSee(d.u)}
function ddPick(s,v){s.value=v;ddFill(s);ddClose();s._dd.b.focus();s.dispatchEvent(new Event("input",{bubbles:true}));s.dispatchEvent(new Event("change",{bubbles:true}))}
function ddKey(e,s){const d=s._dd,open=d.w.classList.contains("open"),lis=[...d.u.children];let h=lis.findIndex(x=>x.classList.contains("hl"));
if(e.key=="Escape"&&open){e.preventDefault();e.stopPropagation();ddClose();return}
if(e.key=="ArrowDown"||e.key=="ArrowUp"){e.preventDefault();if(!open){ddOpen(s);return}
h=Math.max(0,Math.min(lis.length-1,h+(e.key=="ArrowDown"?1:-1)));lis.forEach(x=>x.classList.remove("hl"));lis[h].classList.add("hl");ddSee(lis[h]);return}
if((e.key=="Enter"||e.key==" ")&&open){e.preventDefault();if(lis[h])ddPick(s,lis[h].dataset.o);else ddClose();return}
if(e.key=="Tab")ddClose()}

/* shrink photos in the browser: max 1200px, WebP/JPEG (≈100–250 KB instead of several MB) */
async function shrinkImg(f,MX=1200,Q=.78){
if(!/^image\/(jpeg|png|webp)$/.test(f.type)||!window.createImageBitmap)return f;
try{const bmp=await createImageBitmap(f),k=Math.min(1,MX/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(bmp,0,0,w,h);if(bmp.close)bmp.close();
const tb=(ty,q)=>new Promise(r=>cv.toBlob(r,ty,q));
let b=await tb("image/webp",Q);if(!b||b.type!="image/webp")b=await tb("image/jpeg",Q+.02);
if(b&&b.size<f.size)return b}catch(e){}
return f}
async function upImg(f,MX,pre){
if(!FBOK)return URL.createObjectURL(f);
if(f.size>25e6)throw new Error("Image too large (max 25 MB)");
f=await shrinkImg(f,MX||1200,MX?.7:.78);
if(f.size>8e6)throw new Error("Image too large (max 8 MB)");
const ty=f.type||"image/jpeg",ext=ty=="image/webp"?"webp":ty=="image/png"?"png":ty=="image/gif"?"gif":"jpg";
const path=USER.uid+"/"+(pre||"")+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
const r=await db.storage.from("listings").upload(path,f,{contentType:ty,cacheControl:"31536000"});
if(r.error)throw r.error;
return db.storage.from("listings").getPublicUrl(path).data.publicUrl}
