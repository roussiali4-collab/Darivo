en:{terms:["{name} is a free classified-ads platform. We do not take part in deals between advertisers and visitors.","Advertisers are solely responsible for their ads: accuracy, prices, photos and the legality of what they offer (licences, permits, taxes).","Visitors contact the advertiser directly by phone or WhatsApp. {name} takes no commission and handles no payments. Never send money in advance to someone you do not know.","Every new or edited ad is reviewed by an administrator before it is published. We may refuse, edit or remove any ad or review that is misleading, illegal, offensive or spam.","Reviews must be honest, respectful and based on a real experience."],

fr:{terms:["{name} est une plateforme de petites annonces gratuites. Nous ne participons pas aux accords entre annonceurs et visiteurs.","Les annonceurs sont seuls responsables de leurs annonces : exactitude, prix, photos et légalité de ce qu'ils proposent (autorisations, licences, taxes).","Les visiteurs contactent directement l'annonceur par téléphone ou WhatsApp. {name} ne prend aucune commission et ne gère aucun paiement. N'envoyez jamais d'argent à l'avance à quelqu'un que vous ne connaissez pas.","Chaque annonce nouvelle ou modifiée est vérifiée par un administrateur avant sa publication. Nous pouvons refuser, modifier ou supprimer toute annonce ou tout avis trompeur, illégal, offensant ou indésirable.","Les avis doivent être honnêtes, respectueux et fondés sur une expérience réelle."],
privacy:["Les annonceurs créent un compte avec un nom, une adresse e-mail et un mot de passe (stocké de façon sécurisée, jamais affiché). Un code à usage unique envoyé par e-mail confirme l'adresse et permet de réinitialiser un mot de passe oublié. L'e-mail du compte n'est jamais affiché sur le site ; un e-mail de contact facultatif ajouté à une annonce est public.","Le numéro de téléphone indiqué sur une annonce est public : les visiteurs l'utilisent pour vous contacter par téléphone ou WhatsApp.","Les avis contiennent le nom et le commentaire saisis par le visiteur.","Les données sont stockées chez nos prestataires (Supabase pour les comptes, annonces et photos) et ne sont jamais vendues. Pour accéder à vos données ou les supprimer, contactez {email}.","Le site utilise uniquement le stockage essentiel du navigateur (langue et sécurité)."]},
ar:{terms:["{name} منصة إعلانات مبوّبة مجانية. لا نتدخل في الاتفاقات بين المعلنين والزوار.","المعلن وحده مسؤول عن إعلانه: صحة المعلومات والأثمنة والصور وقانونية ما يعرضه (التراخيص والضرائب).","يتواصل الزائر مع المعلن مباشرة بالهاتف أو واتساب. {name} لا يأخذ عمولة ولا يتعامل مع أي مدفوعات. لا ترسل مالاً مسبقاً لشخص لا تعرفه.","كل إعلان جديد أو معدّل يراجعه المدير قبل نشره. يحق لنا رفض أو تعديل أو حذف أي إعلان أو رأي مضلّل أو مخالف للقانون أو مسيء أو مزعج.","يجب أن تكون الآراء صادقة ومحترمة ومبنية على تجربة حقيقية."],
privacy:["آخر تحديث: 15 نوفمبر 2026", "مرحباً بك في {name}، المنصة الإلكترونية المتخصصة في إعلانات العقارات والأراضي والخدمات في المملكة المغربية.", "نحن نحترم خصوصية مستخدمينا ونلتزم بحماية بياناتهم الشخصية، ونعمل على معالجتها وفقاً للقوانين المعمول بها في المملكة المغربية، وخاصة القانون رقم 09-08 المتعلق بحماية الأشخاص الذاتيين تجاه معالجة المعطيات ذات الطابع الشخصي.", "باستخدامك لمنصتنا أو إنشاء حساب فيها، فإنك توافق على أحكام سياسة الخصوصية هذه.", "§ 1. المعلومات التي نقوم بجمعها", "عند استخدام المنصة، قد نقوم بجمع المعلومات التالية:", "¶ أولاً: معلومات الحساب", "• الاسم (الذي يظهر على إعلاناتك).", "• عنوان البريد الإلكتروني (لا يظهر في الموقع للعموم).", "• المدينة ونوع الخدمة التي يختارها المعلن عند إنشاء الحساب.", "• كلمة المرور الخاصة بالحساب (تُحفظ بصيغة مشفّرة آمنة ولا تُعرض لأي مستخدم). ويُرسل رمز تأكيد إلى بريدك عند إنشاء الحساب أو عند استعادة كلمة المرور.", "¶ ثانياً: معلومات الإعلانات", "• نوع العقار أو الخدمة (شقة، منزل، فيلا، غرفة، أرض، خدمات وغيرها).", "• المدينة والمنطقة.", "• السعر المطلوب للبيع أو الكراء.", "• صور الإعلان.", "• وصف الإعلان ومساحته ومواصفاته.", "• رقم الهاتف / واتساب الذي يضعه المعلن في الإعلان، وبريد إلكتروني للتواصل اختياري (يظهر للزوار علناً إن أضافه).", "• الآراء والتعليقات التي يكتبها الزوار، مع الاسم الذي يدخلونه.", "¶ ثالثاً: المعلومات التقنية", "• عنوان IP عند الاقتضاء.", "• نوع الجهاز والمتصفح.", "• بيانات استخدام الموقع.", "• ملفات تعريف الارتباط (Cookies) وفق إعدادات المستخدم.", "§ 2. كيفية استخدام المعلومات", "نستخدم المعلومات التي نجمعها للأغراض التالية:", "• إنشاء حسابات المستخدمين وإدارتها.", "• السماح بنشر الإعلانات.", "• عرض العقارات والخدمات للزوار.", "• تمكين المهتمين من التواصل مع المعلنين.", "• التحقق من الحسابات والحد من الإعلانات الوهمية والاحتيالية.", "• تحسين خدمات المنصة وتجربة الاستخدام.", "• حماية الموقع من الأنشطة غير القانونية أو إساءة الاستخدام.", "• إرسال الإشعارات المتعلقة بالحساب والإعلانات عند الضرورة.", "§ 3. خصوصية أرقام الهواتف", "تتيح منصتنا للمعلنين إمكانية إضافة رقم هاتف للتواصل مع المهتمين بإعلاناتهم. نوضح ما يلي:", "• رقم الهاتف الذي يضعه المعلن في إعلانه يظهر للزوار علناً، ليتمكنوا من التواصل معه بالهاتف أو واتساب.", "• لا يظهر الرقم في أي مكان آخر من الموقع خارج الإعلان. وبريد حسابك لا يظهر للعموم، أما البريد الاختياري الذي تضيفه إلى إعلانك فيظهر لتمكين الزوار من مراسلتك.", "• يتحمل المعلن مسؤولية التأكد من صحة رقم الهاتف المنشور، وألا ينشر رقماً لا يملك الحق في استخدامه.", "• يمكن للمعلن تعديل الرقم أو حذف الإعلان في أي وقت من خلال حسابه.", "لا نقوم بنشر رقم هاتف أي مستخدم إلا ضمن إعلان أدخله بنفسه.", "§ 4. مشاركة المعلومات مع أطراف أخرى", "نحن لا نبيع البيانات الشخصية للمستخدمين ولا نتاجر بها.", "قد تتم مشاركة بعض المعلومات عند الضرورة مع:", "• مزودي خدمات الاستضافة وتشغيل الموقع.", "• مزودي خدمات قواعد البيانات وتخزين الملفات (مثل Supabase).", "• مزودي خدمات الحماية والتحليلات التقنية.", "• الجهات الحكومية والقضائية المختصة عندما يفرض القانون ذلك.", "نحرص على أن تتم معالجة البيانات وفق الضمانات القانونية والأمنية المناسبة.", "§ 5. تخزين البيانات وحمايتها", "نعتمد تدابير تقنية وتنظيمية مناسبة لحماية المعلومات الشخصية من الوصول غير المصرح به أو التعديل أو الفقدان أو الكشف غير المشروع.", "قد نستخدم خدمات استضافة وقواعد بيانات خارج المملكة المغربية لتشغيل المنصة. وفي هذه الحالة، تتم مراعاة المتطلبات القانونية المتعلقة بنقل المعطيات الشخصية إلى الخارج، وفقاً للقانون المغربي رقم 09-08.", "§ 6. ملفات تعريف الارتباط (Cookies)", "قد يستخدم الموقع ملفات تعريف الارتباط أو التخزين في المتصفح لتحسين تجربة المستخدم، ومنها:", "• حفظ تفضيلات المستخدم (مثل اللغة).", "• تسهيل تسجيل الدخول.", "• تحسين أداء الموقع.", "• تحليل الزيارات والاستخدام.", "• عرض الإعلانات عند تفعيل خدمات الإعلانات.", "يمكن للمستخدم التحكم في ملفات تعريف الارتباط من خلال إعدادات المتصفح أو لوحة تفضيلات ملفات الارتباط المتاحة بالموقع.", "§ 7. الإعلانات والخدمات الخارجية", "قد تستخدم المنصة مستقبلاً خدمات إعلانية مثل Google AdSense. يمكن لهذه الخدمات استخدام تقنيات ملفات تعريف الارتباط أو تقنيات مشابهة لتقديم الإعلانات وقياس أدائها وفق إعدادات الموافقة والمتطلبات القانونية المعمول بها.", "تخضع هذه الخدمات أيضاً لسياسات الخصوصية الخاصة بمزوديها.", "§ 8. حقوق المستخدم", "وفقاً للقانون المغربي رقم 09-08، يتمتع المستخدم بالحقوق القانونية المتعلقة بمعطياته الشخصية، بما في ذلك:", "• الحق في معرفة المعلومات التي تتم معالجتها.", "• الحق في الوصول إلى بياناته الشخصية.", "• الحق في طلب تصحيح المعلومات غير الدقيقة.", "• الحق في طلب حذف البيانات عندما تتوفر الشروط القانونية لذلك.", "• الحق في الاعتراض على معالجة بياناته في الحالات التي يسمح بها القانون.", "• الحق في سحب الموافقة عندما تكون المعالجة مبنية عليها، دون التأثير على قانونية المعالجة السابقة للسحب.", "يمكن ممارسة هذه الحقوق من خلال التواصل معنا عبر البريد الإلكتروني الموضح أدناه، مع مراعاة الشروط والاستثناءات القانونية.", "§ 9. حذف الحساب", "يمكن للمستخدم طلب حذف حسابه من المنصة. عند تقديم طلب الحذف، نقوم بمعالجة الطلب وفق الإجراءات المعتمدة، وقد يتم حذف أو إخفاء الإعلانات المرتبطة بالحساب.", "قد نحتفظ ببعض المعلومات عندما يكون ذلك ضرورياً للوفاء بالتزامات قانونية أو لحماية الحقوق والمصالح المشروعة للمنصة، وفقاً للقانون.", "§ 10. مسؤولية المستخدم", "يلتزم المستخدم بما يلي:", "• تقديم معلومات صحيحة عند التسجيل.", "• عدم نشر معلومات شخصية تخص أشخاصاً آخرين دون إذنهم.", "• عدم نشر أرقام هواتف أو صور أو بيانات لا يملك الحق في استخدامها.", "• المحافظة على سرية كلمة المرور ورموز التأكيد التي تصله.", "• عدم استخدام المنصة لأغراض احتيالية أو غير قانونية.", "§ 11. خصوصية الأطفال", "المنصة موجهة للأشخاص الذين يمكنهم قانونياً إنشاء حسابات واستخدام خدماتها. لا نستهدف جمع البيانات الشخصية للأطفال بشكل متعمد دون مراعاة الموافقات والمتطلبات القانونية المتعلقة بهم.", "§ 12. التعديلات على سياسة الخصوصية", "نحتفظ بحق تحديث سياسة الخصوصية عند الحاجة، سواء نتيجة تطوير خدمات المنصة أو التغييرات القانونية. سيتم نشر النسخة الجديدة على هذه الصفحة مع تحديث تاريخ آخر تعديل.", "ننصح المستخدمين بمراجعة هذه الصفحة بشكل دوري.", "§ 13. التواصل معنا", "إذا كانت لديك أسئلة أو طلبات تتعلق بخصوصية بياناتك الشخصية، يمكنك التواصل معنا عبر:", "• اسم المنصة: {name}", "• البريد الإلكتروني: {email}", "• الدولة: المملكة المغربية", "• الموقع الإل const tmOpen=()=>!$("#tm").hidden;
function closeTM(){const m=$("#tm");if(m)m.hidden=true}
function openTM(k){const m=$("#tm"),tb=$(`#tabs [data-c="${k}"]`);if(!m||!tb)return;
const opts=OPTS(k);
m.innerHTML=opts.map(o=>`<button type="button" role="menuitem" class="tmi${SUB==o[0]?" on":""}" data-sub="${esc(o[0])}">${o[2]||""}<span>${esc(o[1])}</span></button>`).join("");
m.hidden=false;const r=tb.getBoundingClientRect(),w=m.offsetWidth||210,rtl=document.documentElement.dir=="rtl";
let left=rtl?r.right-w:r.left;left=Math.max(8,Math.min(left,innerWidth-w-8));
m.style.top=(r.bottom+6)+"px";m.style.left=left+"px"}

if(mt&&k==C&&tmOpen())closeTM();
else{if(k!=C||!mt){C=k;SUB="";MAXP=0;OFFER="";AMS.clear();render()}
if(mt)openTM(k)}}

/* shrink photos in the browser: max 1200px, WebP/JPEG (≈100–250 KB instead of several MB) */
async function shrinkImg(f,MX=1200,Q=.78){
if(!/^image\/(jpeg|png|webp)$/.test(f.type)||!window.createImageBitmap)return f;
try{const bmp=await createImageBitmap(f),k=Math.min(1,MX/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(bmp,0,0,w,h);if(bmp.close)bmp.close();
const tb=(ty,q)=>new Promise(r=>cv.toBlob(r,ty,q));
let b=await tb("image/webp",Q);if(!b||b.type!="image/webp")b=await tb("image/jpeg",Q+.02);
if(b&&b.size<f.size)return b}catch(e){}
return f}
/* Storage cleanup: delete a listing's photo files when the listing (or a photo) is removed */
const stPath=u=>{const m=/\/storage\/v1\/object\/public\/listings\/(.+)$/.exec(String(u||""));if(!m)return null;try{return decodeURIComponent(m[1])}catch(e){return null}};
const itemFiles=i=>[...new Set([...((i&&i.imgs)||[]),i&&i.img,i&&i.thumb].map(stPath).filter(Boolean))];
async function ownFiles(){const out=[];try{for(let o=0;o<2000;o+=100){const r=await db.storage.from("listings").list(USER.uid,{limit:100,offset:o});if(r.error||!r.data||!r.data.length)break;r.data.forEach(f=>{if(f.name&&f.id)out.push(USER.uid+"/"+f.name)});if(r.data.length<100)break}}catch(e){}return out}
const rmFiles=async ps=>{if(!db||!ps||!ps.length)return;try{await db.storage.from("listings").remove(ps)}catch(e){console.warn("storage cleanup",e)}};
async function upImg(f,MX,pre){
if(!FBOK)return URL.createObjectURL(f);
if(f.size>25e6)throw new Error("Image too large (max 25 MB)");
f=await shrinkImg(f,MX||1200,MX?.7:.78);
if(f.size>8e6)throw new Error("Image too large (max 8 MB)");
const ty=f.type||"image/jpeg",ext=ty=="image/webp"?"webp":ty=="image/png"?"png":ty=="image/gif"?"gif":"jpg";
const path=USER.uid+"/"+(pre||"")+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
const r=await db.storage.from("listings").upload(path,f,{contentType:ty,cacheControl:"31536000"});
if(r.error)throw r.error;
return db.storage.from("listings").getPublicUrl(path).data.publicUrl}
